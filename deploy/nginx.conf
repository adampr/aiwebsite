# aicompany-template: nginx.conf.tpl@a7212884717d1d527735778a5a80cf1342aa35c7d048187948595c6da3b4573b
# ai.xl.net — served exclusively through the Cloudflare tunnel.
# nginx binds to loopback only; cloudflared connects to 127.0.0.1:80
# and Cloudflare terminates TLS at the edge.

server {
    # NGINX_LISTEN (v1.4.0): 80 for standard hosts; a host whose tunnel
    # ingress already points elsewhere (e.g. legacy :8080) keeps its port so
    # cutovers never have to touch the tunnel — the ingress flip stays the
    # reserved rollback lever.
    listen 127.0.0.1:80 default_server;
    # server_name carries ai.xl.net plus EXTRA_DOMAINS (§20) — the outreach
    # sending domain, on the hosts that run outreach. It is served by this same
    # box because sharing a server is not sharing email reputation (that is a
    # property of the domain in the message headers and body), and it must
    # answer for real: /u/<token> is the one-click unsubscribe carried by every
    # cold email, and a redirect to ai.xl.net would 404 it. Hosts without
    # outreach render just ai.xl.net — the suffix form keeps the trailing space
    # out (v1.38.0).
    server_name ai.xl.net;

    # cloudflared handles TLS termination; recover the real client IP
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Host drop-ins (v1.4.0): committed deploy/nginx.d/*.conf are installed to
    # /etc/nginx/aiwebsite.d/ by setup-vm.sh. Silently empty for hosts without
    # drop-ins; prefix-location precedence makes ordering vs the locations
    # below irrelevant.
    include /etc/nginx/aiwebsite.d/*.conf;

    # Next.js site
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static assets from Next.js
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Twilio webhooks + media-stream WebSocket for the brain.
    # ONLY /brain/twilio/ is exposed publicly — the brain runs in open-gate
    # mode (no API keys), so the rest of its API must stay loopback-only.
    # These endpoints validate the X-Twilio-Signature header themselves.
    location /brain/twilio/ {
        proxy_pass http://127.0.0.1:3211/twilio/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Media-stream WebSocket stays open for the duration of a call
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # aic_combined is declared ONCE, fleet-wide, in
    # /etc/nginx/conf.d/00-aicompany-log-format.conf, installed by setup-vm.sh BEFORE
    # this file (Debian includes conf.d/*.conf before sites-enabled/*, both in
    # http context, and nginx parses sequentially).
    #
    # It CANNOT be declared here: `log_format` is an http-context directive.
    # v1.62.0 put it in this block, nginx rejected the whole config
    # (`[emerg] "log_format" directive is not allowed here`), it reached
    # production, and the box sat one restart from nginx failing to start.
    #
    # Consequence to respect when rolling back: this file is only valid on a box
    # where setup-vm.sh from the SAME tag has run. A full §9.6 rollback
    # (re-pin -> render.mjs -> commit -> redeploy) is safe because the re-render
    # removes this reference; the orphaned conf.d file is inert, since a
    # declared-but-unreferenced log_format is legal. Do NOT hand-delete that file
    # on a host pinned at >= v1.64.0, and do NOT hand-edit this rendered file —
    # nginx.conf and setup-vm.sh are safe only as a matched pair from one tag.
    access_log /var/log/nginx/aiwebsite.access.log aic_combined;
    error_log /var/log/nginx/aiwebsite.error.log;
}
