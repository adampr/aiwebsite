# aicompany-template: nginx.conf.tpl@3fc509454a3b8ab4dc6c6e3e79dfdca661049638c2da2c2e149e5bae5695617d
# ai.xl.net — served exclusively through the Cloudflare tunnel.
# nginx binds to loopback only; cloudflared connects to 127.0.0.1:80
# and Cloudflare terminates TLS at the edge.

# v1.178.0 (§19.33.5, refutation N8): the narration file location's own
# "not found" (the file vanished between the app's check and nginx opening it)
# and "refused" (a planted link) must never be stored, like the app's own
# 404s. Its year-long Cache-Control is added only to success answers (no
# `always`), so these carried no cache instruction at all and Cloudflare stored
# them for its zone default. A status-keyed value, empty (= no header) for
# every other status, so the 200/206/304 answers and nginx's 416 (which keeps
# the header it added before the range step) are unchanged. http context: this
# file is included inside http{} (sites-enabled / conf.d).
map $status $aicompany_media_error_cache {
    403     "no-store";
    404     "no-store";
    default "";
}

server {
    # NGINX_LISTEN (v1.4.0): 80 for standard hosts; a host whose tunnel
    # ingress already points elsewhere (e.g. legacy :8080) keeps its port so
    # cutovers never have to touch the tunnel — the ingress flip stays the
    # reserved rollback lever.
    listen 127.0.0.1:80 default_server;
    # server_name carries ai.xl.net plus EXTRA_DOMAINS (§20) — the outreach
    # sending domain, on the hosts that run outreach. It is served by this same
    # box because sharing a server is not sharing email reputation (that is a
    # property of the domain in the message headers and body), and it must
    # answer for real: /u/<token> is the one-click unsubscribe carried by every
    # cold email, and a redirect to ai.xl.net would 404 it. Hosts without
    # outreach render just ai.xl.net — the suffix form keeps the trailing space
    # out (v1.38.0).
    server_name ai.xl.net;

    # cloudflared handles TLS termination; recover the real client IP
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    # Host drop-ins (v1.4.0): committed deploy/nginx.d/*.conf are installed to
    # /etc/nginx/aiwebsite.d/ by setup-vm.sh. Silently empty for hosts without
    # drop-ins; prefix-location precedence makes ordering vs the locations
    # below irrelevant. (Since v1.177.0 this file has ONE regular-expression
    # location, the Twilio webhooks under /brain/twilio/, and one `^~` prefix,
    # the internal audio location: a drop-in's plain prefix cannot take either.)
    include /etc/nginx/aiwebsite.d/*.conf;

    # Next.js site
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # v1.177.0 (§19.33.5): tells the app that THIS nginx serves its media
        # files (the internal location below). proxy_set_header REPLACES a
        # same-named header a client sent, so it cannot be forged through here.
        proxy_set_header X-Aicompany-Accel "media-v1";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # /_next/static has NO location of its own since v1.177.0: it is served
    # through `location /` like every page. The block that stood here
    # (`expires 365d` plus an add_header Cache-Control) had two defects. A
    # location with an add_header of its own inherits none of the server's, so
    # every script, stylesheet and font went out WITHOUT the security headers
    # at the foot of this file (seen live on all four template sites,
    # 2026-11-15). And it wrote a second, different Cache-Control beside the
    # one Next already sends for these files: Next answers a hashed asset with
    # `public, max-age=31536000, immutable` and a missing one with no-store,
    # and does not let either be overridden. tests/nginx-routing.test.ts holds
    # every location in this file to the rule: no add_header of its own, or
    # every server-level header repeated.

    # Browser reports (v1.177.0, architecture.md §5.18). A host that has
    # switched on the watch-only Content-Security-Policy (two header lines in
    # its own drop-in, deploy/nginx.d/) names this address as the place
    # browsers send their reports. Anonymous and public by nature, so it is
    # fenced here before the app sees a byte: POST (and GET, the operator's
    # keyed read-out) only; 64 KiB at most, held in memory, never spooled to
    # disk; ten seconds to send it; and the same refusal of a compressed body
    # as the Twilio doors below. No add_header: the server-level set applies.
    location = /api/csp-report {
        limit_except GET POST { deny all; }
        client_max_body_size 64k;
        client_body_buffer_size 64k;
        client_body_timeout 10s;
        if ($http_content_encoding !~* "^(identity)?$") {
            return 415;
        }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # Narration audio (v1.177.0, architecture.md §19.33.5). The public audio URL
    # (blog.audio.routePath, e.g. /blog/audio/<slug>.mp3?v=<hash>) is still
    # answered by the app through `location /`: it checks the slug, rate-limits,
    # reads the blog_audio row, makes sure the file named by the row's content
    # hash is on disk, and answers
    #   X-Accel-Redirect: /_aicompany_media/audio/<slug>.<hash>.mp3
    # This block then serves that file with nginx's static handler: Content-Length
    # on every answer, native byte ranges (206 + Content-Range, 416 when
    # unsatisfiable), If-None-Match / If-Range against the file's own ETag.
    # Why: next >= 16.4.5 drops Content-Length from every App Router
    # route-handler Response, and Cloudflare then answers Range requests on that
    # copy with 200 and no Content-Range (roleplay, 2026-11-13).
    #  internal          only an X-Accel-Redirect reaches it; outside requests 404
    #  ^~                no regex location (a host drop-in's included) can take it
    #  alias …/ + …/     both trailing slashes: the off-by-slash traversal needs a mismatch
    #  disable_symlinks  a link planted in the directory is refused (403)
    #  max_ranges 1      a multi-range request gets the whole file at 200, as the
    #                    route handler always answered (no multipart bodies)
    #  gzip off          a compressed answer would lose Content-Length and ranges
    #  Cache-Control     set HERE (not by the app) and WITHOUT `always`, so a 404
    #                    or 403 from this block never carries it. (A 416 does:
    #                    nginx adds headers before its range step. Harmless —
    #                    416 is not a status the edge stores.)
    #  add_header        a location with an add_header of its own inherits
    #                    NONE of the server's, so the four at the foot of this
    #                    file are repeated here verbatim
    location ^~ /_aicompany_media/audio/ {
        internal;
        alias /var/lib/aiwebsite/media/audio/;
        disable_symlinks on from=/var/lib/aiwebsite/media/audio;
        autoindex off;
        gzip off;
        max_ranges 1;
        types { audio/mpeg mp3; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Cache-Control $aicompany_media_error_cache always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Twilio's doors into the brain (v1.177.0, architecture.md §9.1). The brain
    # runs in open-gate mode (no API keys), so the rest of its API must stay
    # loopback-only: ONLY what Twilio itself calls is forwarded, by exact path,
    # and everything else under /brain/twilio/ answers 404 right here. Until
    # v1.177.0 the whole prefix was forwarded, which also put on the internet
    # the two routes under it that Twilio never calls (/twilio/dial and
    # /twilio/sms/send, each behind the brain's own key check and nothing
    # else) and any route a later Brain release would add.
    #
    # THE LIST is the Brain's, read at Brain tag v1.193
    # (apps/brain-api/src/server.ts): the 17 webhook routes that carry
    # requireTwilioSignature, the media-stream socket, and the hold music the
    # Brain's own TwiML tells Twilio to fetch. An 18th route carries the
    # signature check, /twilio/voice/fake-vendor, but it exists only under
    # VOICE_HOLD_SIMULATION_ENABLED (a dev-box QA route, 404 otherwise) and is
    # NOT forwarded. tests/nginx-routing.test.ts pins the names and runs this
    # block in a real nginx. A Brain release that adds a route Twilio calls
    # needs this list, that test and a re-render on every host, in one module
    # release.
    #
    # 1) The webhooks, POST only. A regular-expression location wins over the
    #    plain prefix in (4). The matched name is a NAMED capture, never `$1`:
    #    the `if` below is a regular expression too, and a later match
    #    overwrites the numbered captures (the first build of this block sent
    #    every webhook to /twilio/ with an empty name; a routed request caught
    #    it). `$twilio_door` can hold only [a-z/-], so nothing in it is
    #    re-encoded, and the query string goes through untouched: Twilio signs
    #    the full URL, query included, and the brain checks that signature.
    #    The pattern ends in `\z`, not `$`: a `$` also matches before a
    #    trailing newline, which would let /brain/twilio/sms/inbound%0A in.
    location ~ ^/brain/twilio/(?<twilio_door>voice/(?:fallback|outbound|inbound|rejoin-gate|status|connect-action|hold-loop|hold-return|conference-ai|participant-status|conference-events|callback-answer|callback-gate|hold-confirm)|sms/(?:status|fallback|inbound))\z {
        limit_except POST { deny all; }
        # Decompression-bomb guard (v1.174.0, §5.4): a body that declares any
        # Content-Encoding other than identity is refused with 415 BEFORE nginx
        # reads it or proxies a byte. brain-api's app-wide express.json() and
        # express.urlencoded() inflate gzip, deflate and br bodies before the
        # route's Twilio signature check runs (S2 item 7.3, measured on
        # roleplay), so a route-level option would come too late. Twilio never
        # compresses a webhook body. `return` is one of the two directives
        # that are safe inside `if` in a location. nginx itself never decodes
        # a request body.
        if ($http_content_encoding !~* "^(identity)?$") {
            return 415;
        }
        proxy_pass http://127.0.0.1:3211/twilio/$twilio_door$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2) The media-stream WebSocket: a bodiless GET upgrade, open for the
    #    length of a call.
    location = /brain/twilio/ws {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3211/twilio/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 3) The hold music. The Brain's hold TwiML plays
    #    <BRAIN_PUBLIC_URL>/assets/hold-music.mp3 unless VOICE_HOLD_MUSIC_URL
    #    names another file, and that is this one address outside
    #    /brain/twilio/. Until v1.177.0 it was not forwarded at all, so a host
    #    with hold switched on would have had Twilio fetch a 404. One exact
    #    file, GET and HEAD only: nothing else under /brain/assets/ is exposed.
    location = /brain/assets/hold-music.mp3 {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3211/assets/hold-music.mp3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4) Everything else under /brain/twilio/ — the key-protected routes, the
    #    test-only route, a typo, a route a future Brain adds — stops here and
    #    never reaches the brain.
    location /brain/twilio/ {
        return 404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # aic_combined is declared ONCE, fleet-wide, in
    # /etc/nginx/conf.d/00-aicompany-log-format.conf, installed by setup-vm.sh BEFORE
    # this file (Debian includes conf.d/*.conf before sites-enabled/*, both in
    # http context, and nginx parses sequentially).
    #
    # It CANNOT be declared here: `log_format` is an http-context directive.
    # v1.62.0 put it in this block, nginx rejected the whole config
    # (`[emerg] "log_format" directive is not allowed here`), it reached
    # production, and the box sat one restart from nginx failing to start.
    #
    # Consequence to respect when rolling back: this file is only valid on a box
    # where setup-vm.sh from the SAME tag has run. A full §9.6 rollback
    # (re-pin -> render.mjs -> commit -> redeploy) is safe because the re-render
    # removes this reference; the orphaned conf.d file is inert, since a
    # declared-but-unreferenced log_format is legal. Do NOT hand-delete that file
    # on a host pinned at >= v1.64.0, and do NOT hand-edit this rendered file —
    # nginx.conf and setup-vm.sh are safe only as a matched pair from one tag.
    access_log /var/log/nginx/aiwebsite.access.log aic_combined;
    error_log /var/log/nginx/aiwebsite.error.log;
}
