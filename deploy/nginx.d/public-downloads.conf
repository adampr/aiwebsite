# Public artifact downloads (v1.19.x): static files served from /var/www/downloads,
# a VM-owned dir outside the app tree (deploys never touch it). Added 2026-08-13 for
# the LongMemEval-V2 leaderboard submission tarball; safe for any future artifacts.
location /downloads/ {
    alias /var/www/downloads/;
    autoindex off;
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff;
}
