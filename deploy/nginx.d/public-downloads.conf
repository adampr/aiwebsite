# Public artifact downloads (v1.19.x): static files served from /var/www/downloads,
# a VM-owned dir outside the app tree (deploys never touch it). Added 2026-08-13 for
# the LongMemEval-V2 leaderboard submission tarball; safe for any future artifacts.
location /downloads/ {
    alias /var/www/downloads/;
    autoindex off;
    default_type application/octet-stream;
    # A location with an add_header of its own inherits none of the server's, so the
    # four security headers of the rendered server block are repeated here, exactly
    # as written there (module MIGRATIONS v1.177.0 step 2, "aiwebsite only";
    # 2026-11-19). This replaces the one header this file set before.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
