# Host nginx drop-in (module v1.4.0 mechanism: committed deploy/nginx.d/*.conf
# are installed to /etc/nginx/aiwebsite.d/ by setup-vm.sh and pulled in by the
# stamped nginx.conf's server-level `include /etc/nginx/aiwebsite.d/*.conf;` —
# never edit deploy/nginx.conf itself, it is rendered from the module template
# and re-rendering would orphan the edit).
#
# XLANT DEVICE LANE BODY CAP (ARCHITECTURE.md §5.22).
#
# WHY THIS EXISTS. The server-level `client_max_body_size 110m` in
# governance-upload.conf is sized for /work package uploads (100 MB program
# zips) and applies to EVERY location, this one included. But /api/xlant/relay/*
# runs PRE-AUTH by design — the XLAnt relay authenticates downstream, so the
# route cannot know who the caller is until after it has decided what to do
# with the body — and its own cap is 1 MB. Without this drop-in an
# unauthenticated POST to the device lane makes nginx buffer up to 110 MB to
# disk/memory before the route's 1 MB check ever runs. The route's cap is
# correct and stays; this moves the refusal to the cheapest place that can make
# it. (roleplay, where this lane used to live, had a 25 m server-level cap and
# so never presented this much surface.)
#
# WHY 2m. The largest legitimate body on this lane is well under 1 MB: a capped
# incident detail, a tool result, or an MCP tools/call frame. 2m leaves the
# ROUTE as the thing that draws the 1 MB line — a caller a little over the cap
# gets the route's JSON `{"error":"body too large"}` 413 rather than nginx's
# HTML one — while still ending a multi-megabyte flood at the edge of the
# process. Do not raise it without raising MAX_BODY in the route first.
#
# The `^~` modifier: a prefix match that wins over the regex locations the
# stamped conf could grow later, so the device lane cannot silently fall back
# to `location /` and the 110m cap. Everything else below is copied VERBATIM
# from deploy/nginx.conf's `location /` block, so apart from the body cap this
# lane is byte-identical to the rest of the site — same upstream, same headers,
# same 120 s timeouts.
#
# If this file is malformed the deploy's `nginx -t` fails and the deploy aborts
# BEFORE the cutover, which is the intended failure direction: no config, no
# device lane, rather than a device lane served under the wrong cap. (If nginx -t
# was already failing before the deploy, setup-vm.sh installs no config and the
# deploy continues — clear that first, or this cap never lands.)
location ^~ /api/xlant/ {
    client_max_body_size 2m;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
