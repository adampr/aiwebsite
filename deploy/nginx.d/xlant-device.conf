# Host nginx drop-in (module v1.4.0 mechanism: committed deploy/nginx.d/*.conf
# are installed to /etc/nginx/aiwebsite.d/ by setup-vm.sh and pulled in by the
# stamped nginx.conf's server-level `include /etc/nginx/aiwebsite.d/*.conf;` —
# never edit deploy/nginx.conf itself, it is rendered from the module template
# and re-rendering would orphan the edit).
#
# /api/xlant BODY CAP (ARCHITECTURE.md §5.22).
#
# THE LANE THIS WAS WRITTEN FOR IS GONE, AND THE CAP STAYS. Until 2026-09-15
# this host served XLAnt's DEVICE lane and /api/xlant/relay/* ran PRE-AUTH by
# design — the relay authenticated downstream, so the route could not know who
# the caller was until after it had decided what to do with the body. The lane
# was decommissioned that day (the relay measured zero active devices still
# reaching this front; the canonical origin xlant.ai serves it now) and both
# route files are deleted, so /api/xlant/* is a 404 from Next.
#
# WHY THE FILE IS NOT DELETED WITH THEM. nginx buffers a request body BEFORE
# the app sees the path, and the server-level `client_max_body_size 110m` in
# governance-upload.conf — sized for /work package uploads, 100 MB program zips
# — applies to every location. Without this drop-in an anonymous POST to a
# publicly known path that stranded pre-0.13.4 desktops may still try makes
# nginx buffer up to 110 MB to disk/memory to produce a 404. 2m ends that at
# the cheapest place that can end it. (roleplay.xl.net, where this lane lived
# before 2026-09-04, had a 25 m server-level cap and so never presented this
# much surface — history only: it has carried nothing of XLAnt since.)
#
# WHY 2m, AND NOT SOMETHING SMALLER NOW. It was chosen to leave the ROUTE
# drawing the 1 MB line (MAX_BODY), so a caller a little over the cap got the
# route's JSON `{"error":"body too large"}` 413 rather than nginx's HTML one.
# No route reads it any more, so the number is now just a flood ceiling; it is
# left where it is because the canonical front carries the same value for the
# live lane, and a cap that drifts between the two fronts is a body one accepts
# and the other refuses. If this host's lane is ever revived, raise MAX_BODY in
# the route before raising this.
#
# The `^~` modifier: a prefix match that wins over the regex locations the
# stamped conf could grow later, so this prefix cannot silently fall back to
# `location /` and the 110m cap. Everything else below is copied VERBATIM
# from deploy/nginx.conf's `location /` block, so apart from the body cap this
# prefix is byte-identical to the rest of the site — same upstream, same
# headers, same 120 s timeouts.
#
# If this file is malformed the deploy's `nginx -t` fails and the deploy aborts,
# which is the intended failure direction: no config rather than config served
# under the wrong cap. (If nginx -t was already failing before the deploy,
# setup-vm.sh installs no config and the deploy continues — clear that first, or
# this cap never lands.) setup-vm.sh rsyncs deploy/nginx.d/ with --delete, so
# removing this file here removes the cap from the VM on the next deploy.
location ^~ /api/xlant/ {
    client_max_body_size 2m;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
