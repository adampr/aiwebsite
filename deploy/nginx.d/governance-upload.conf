# Host nginx drop-in (module v1.4.0 mechanism: installed to
# /etc/nginx/aiwebsite.d/ by setup-vm.sh before the conf test).
#
# Upload body-size ceiling, shared server-wide (one directive, one owner):
# - governance format-sample upload (§5.12): files up to 2 MB
#   (CAPS.styleSampleFileMaxBytes)
# - team work submissions (§5.16): program zips / skill packages up to 10 MB
#   (WORK_CAPS.uploadMaxBytes); nginx's 1 MB default (and the previous 3m
#   value here) would 413 them with an HTML error page before the route's
#   instructive JSON rejection could run.
# 12m leaves headroom for multipart framing over the 10 MB route cap. Every
# other route only ever receives small JSON bodies, which this does not
# loosen meaningfully; the true per-route caps are enforced in the handlers.
client_max_body_size 12m;
