# Host nginx drop-in (module v1.4.0 mechanism: installed to
# /etc/nginx/aiwebsite.d/ by setup-vm.sh before the conf test).
#
# Upload body-size ceiling, shared server-wide (one directive, one owner):
# - governance format-sample upload (§5.12): files up to 2 MB
#   (CAPS.styleSampleFileMaxBytes)
# - team work submissions (§5.16): program zips / skill packages up to
#   100 MB (WORK_CAPS.uploadMaxBytes; raised from 10 MB 2026-08-19, owner
#   directive: code repositories over 10 MB must submit); nginx's 1 MB
#   default would 413 them with an HTML error page before the route's
#   instructive JSON rejection could run.
# 110m leaves headroom for multipart framing over the 100 MB route cap.
# THE REAL EDGE CEILING IS CLOUDFLARE, NOT THIS DIRECTIVE: every request
# arrives through the tunnel, and this plan caps the total request body at
# 104,857,600 bytes. The worst legitimate request (100 MB package + 1 MB
# SKILL.md + fields + framing, ~101.0 MB) fits with ~3.8 MB headroom; the
# band between ~104.9 MB and 110m is unreachable, and an over-cap body gets
# Cloudflare's HTML error, never our JSON. Cloudflare also returns 524
# after 100 s without an origin response (tighter than proxy_read_timeout
# 120 s): a very slow uplink can 524 while the submission actually
# succeeded; the retry then hits 409 duplicate_title and an admin clears it.
# Every other route only ever receives small JSON bodies, which this does
# not loosen meaningfully; the true per-route caps are enforced in the
# handlers (including a Content-Length precheck at uploadMaxBytes + 5 MB
# before formData buffering).
client_max_body_size 110m;
